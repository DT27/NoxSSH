# Build every platform and attach the results to a GitHub Release.
#
# One machine cannot do this. The app carries the serialport native bindings,
# which npm installs per platform and architecture and only ever fetches for
# the host it runs on, so a macOS package built on Windows would have none. So
# each entry below installs and builds on its own runner, and the release job
# collects what they produce.
#
# No agent CLI is shipped. All three providers drive the one already on the
# user's machine, so nothing here has to fetch or match a 253MB binary.
#
# Push a tag to publish:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# Running it by hand from the Actions tab builds the same artifacts and uploads
# them for download without creating a release, which is the way to test a
# change to this file.
#
# The release carries more than the installers. electron-builder writes a
# `latest*.yml` beside each build describing what it just made, and the
# `.blockmap` files next to them are what let an update download only the parts
# that changed. Those are what the app reads to update itself, so a release
# missing them is a release nobody can update to. `--publish never` below only
# turns off uploading; the manifests are written either way, and a step in each
# build job fails if one is not.
#
# Once the release exists, a last job points winget at it. That one is optional
# and says so when it skips; docs/winget.md explains what it needs.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not deny you the other four.
      fail-fast: false
      matrix:
        include:
          # Both Windows targets at once: an installer for people who want the
          # app on their machine, and the portable exe for people who cannot
          # install anything. 64-bit only.
          - name: windows-x64
            os: windows-latest
            args: --win --x64
          # Both macOS builds run on Apple silicon. macos-13 was the last Intel
          # runner and queues forever now that it is being retired, so the
          # Intel dmg is cross-built. Packaging never executes the app, it only
          # copies binaries, so the host architecture does not matter there.
          #
          # It matters to npm, though: the install has to be native or the
          # renderer cannot build, because rollup loads a binary for the
          # machine it is running on.
          #
          # `--mac` and not `--mac dmg`, so the zip in the mac target list gets
          # built too. Squirrel updates a mac app from a zip and will not touch
          # a dmg, so the dmg is what a person downloads and the zip is what the
          # app downloads.
          - name: macos-x64
            os: macos-latest
            args: --mac --x64
          - name: macos-arm64
            os: macos-latest
            args: --mac --arm64
          - name: linux-x64
            os: ubuntu-latest
            args: --linux AppImage --x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi

      - run: npm ci

      # Compiles against the C# compiler and WinRT metadata that ship inside
      # Windows. The script no-ops elsewhere, but there is no reason to call it.
      - name: Build the Windows Hello helper
        if: runner.os == 'Windows'
        run: npm run build:hello

      - run: npm run build:renderer

      # cpu-features is dropped in scripts/before-build.js, which electron-builder
      # runs immediately before the native rebuild. ssh2 loads it optionally and
      # nan cannot compile against Electron 43; leaving it in fails the rebuild.

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # There is no signing certificate on a CI runner. Without this,
          # electron-builder hunts for one and fails the macOS build.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The app reads this file to find out a release exists, so a build that
      # did not write one produces an installer nobody can update from, and
      # nothing else about the build looks wrong. Printed as well as checked:
      # the version and the file names in it are worth a glance in the log.
      - name: Check the update manifest was written
        shell: bash
        run: |
          set -e
          case "${{ matrix.name }}" in
            windows-*) manifest=latest.yml ;;
            macos-*)   manifest=latest-mac.yml ;;
            linux-*)   manifest=latest-linux.yml ;;
          esac

          if [ ! -f "dist/$manifest" ]; then
            echo "dist/$manifest was not written. electron-builder produces it"
            echo "from build.publish in package.json; check that it is still there."
            ls -l dist
            exit 1
          fi

          cat "dist/$manifest"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    # Only a tag publishes. A manual run stops after the build job, so the
    # artifacts can be inspected without anything going out.
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      # For scripts/merge-update-manifests.js, and nothing else. No npm install:
      # the script has no dependencies precisely so this step can stay this
      # cheap.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the builds
        run: |
          set -e

          # Every runner writes into its own directory, so flatten first. The
          # names carry their platform and architecture, so nothing collides.
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \
               -o -name '*.zip' -o -name '*.blockmap' \) \
            -exec mv {} . \;

          # One runner each, so these move like the binaries do.
          find artifacts \( -name 'latest.yml' -o -name 'latest-linux.yml' \) -exec mv {} . \;

          # macOS is the exception. Two runners each wrote a latest-mac.yml
          # describing only its own architecture, and moving them both here
          # would leave whichever landed second. Merged instead, because an
          # Intel Mac reading an arm64-only manifest does not fail: it quietly
          # downloads the arm64 build.
          node scripts/merge-update-manifests.js latest-mac.yml \
            $(find artifacts -name 'latest-mac.yml' | sort)

          ls -lh *.exe *.dmg *.AppImage *.zip *.yml

      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The manifests and blockmaps go up with the installers. The app looks
          # for them by name on the release, so a release without them is one
          # the previous version cannot update to.
          git fetch --force --tags origin "${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md

          # A tag with a prerelease suffix (v1.4.3-beta.1) publishes as a
          # pre-release so it never becomes the version `--latest` users and
          # the updater see first.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --prerelease \
              *.exe *.dmg *.AppImage *.zip *.blockmap *.yml
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --latest \
              *.exe *.dmg *.AppImage *.zip *.blockmap *.yml
          fi

  winget:
    name: Open the winget pull request
    needs: release
    runs-on: ubuntu-latest

    # Prerelease tags (v1.4.3-beta.1) are testing builds; winget only ever
    # offers stable versions.
    if: ${{ !contains(github.ref_name, '-') }}

    # A fork can tag a release without owning a fork of winget-pkgs, and that
    # should print a line rather than fail a release that has already gone out.
    # `secrets` cannot be read from an `if:` at either the job or the step
    # level, and a job-level `env:` is the one place it can be turned into
    # something they can both read.
    env:
      HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}

    steps:
      # winget's package list is a repository of YAML, and a new version lands
      # in it by pull request. The action reads this release, hashes the
      # installer, copies the previous version's manifest forward with the new
      # version, URL and hash, and opens that pull request against
      # microsoft/winget-pkgs. A moderator or their CI merges it, usually
      # within a day, and `winget upgrade` starts offering the new version.
      #
      # It cannot bootstrap the package: there has to be a previous version's
      # manifest to copy, and the action stops with an error if there is not.
      # scripts/winget-manifest.js writes that first one by hand, and
      # docs/winget.md is the walk-through for submitting it.
      #
      # Nothing here can touch this repository. The token is only ever used to
      # push a branch to a fork of winget-pkgs and open a pull request from it.
      - uses: vedantmgoyal9/winget-releaser@v2
        if: env.HAS_TOKEN == 'true'
        with:
          identifier: CloudBlast.CloudTerm
          # Both Windows builds are `.exe` files, and the action's default
          # pattern would sweep up the portable one as a second installer for
          # the same architecture. Only the installer belongs in winget.
          installers-regex: '^NoxSSH-Setup-.+-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Say why nothing was submitted
        if: env.HAS_TOKEN != 'true'
        run: |
          echo 'No WINGET_TOKEN secret is set, so the winget package was left alone.'
          echo 'The release itself is published and unaffected. docs/winget.md says'
          echo 'what that secret is and how to create it.'
